name: Publish Windows Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version override, for example 1.2.0
        required: false
        type: string
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      CI: "1"
      NO_PAUSE: "1"
      GOPROXY: https://proxy.golang.org,direct
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Add tool paths
        shell: pwsh
        run: |
          "${env:USERPROFILE}\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          $publishArgs = @("W")
          if (-not [string]::IsNullOrWhiteSpace($env:VERSION)) {
            $publishArgs += @("-Version", $env:VERSION.Trim())
          }

          & .\bat\publish.bat @publishArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Validate installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path publish\output -Filter "AntBrowser-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not generated."
          }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $([Math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Upload tag release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installerFiles = Get-ChildItem -Path publish\output -Filter "AntBrowser-Setup-*.exe"
          if (-not $installerFiles) {
            throw "Windows installer was not generated."
          }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Ant Browser Windows build for $tag"
          }

          foreach ($file in $installerFiles) {
            gh release upload $tag $file.FullName --clobber
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ant-browser-windows-amd64
          path: publish/output/AntBrowser-Setup-*.exe
          if-no-files-found: error
